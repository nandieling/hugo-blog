baseURL = 'https://hugo.nandielinghai.de/'
defaultContentLanguage = "zh"
languageCode = "zh-Hans"
title = '编程技术｜笔记'
description = "编程笔记"
theme = 'dream'

# 内容目录配置
# contentDir="content"

enableGitInfo = true
enableRobotsTXT = true

hasCJKLanguage = true

[markup]
[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.parser.attribute]
block = true

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

# 代码高亮
[markup.highlight]
noClasses = true
codeFences = true
style = 'dracula'
lineNoStart = 1
lineNos = true
lineNumbersInTable = true
tabWidth = 4

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[params]
# 网站完全打开前预加载动画
enablePreLoad = true
# 预加载的动画文字, 只有当enablePreLoad=true时生效
textPreLoad   = "nan"

# 布局改为横栏模式，图在右面
# zenMode = true

# 配置每页记录数
paginate = 12

# 当亮色时候，选择翡翠绿配色
lightTheme = "emerald"
# 当暗色时候，选择森林配色
darkTheme = "forest"

# backgroundImage = "img/personal/1.jpg"
# backgroundImageDark = "img/personal/1.jpg"

images = ["img/personal/1.jpg"]

author = "nan"
description = ""
avatar = "img/personal/崩坏3-格蕾修.png"
headerTitle = "nan | BLOG"
motto = "览影仓库地址：https://github.com/nandieling/OmniPlay 。软件交流QQ群：951690884 ，加群暗号：鱼佬。如有AI需要，欢迎支持我的AI中转站：https://ai.nandielinghai.de 。目前有chatGPT系列模型和gpt-image-2模型，暂未开通支付系统，如需充值请加QQ：2522577023 和微信号：nandielinghaiyang 。邀请好友第一次充值返还邀请人10%额度。 "


footerBottomText = ""

rss = true

# utterancesRepo = "88899/hugo-blog"

# valine = true
# LEANCLOUD_APP_ID = ""
# LEANCLOUD_APP_KEY = ""

# waline = true
# walineServer = ""

email = ""

siteStartYear = 2025

favicon = 'img/personal/崩坏3-格蕾修.png'

# Syntax highlighting
customSyntaxHighlighting = true

# options
# 导航栏吸顶开关
stickyNav = true

# 导航菜单选项
# remove rss
reorderNavItems = ["home", "categories", "tags", "posts", "search", "github", "about"]

# 是否折叠显示导航菜单
#collapseNavItems = ["posts", "categories", "tags", "rss"]
# 是否显示默认的封面图
# noDefaultSummaryCover = true

# 是否显示文章目录
showTableOfContents = true
showSummaryCoverInPost = true
imageZoomableInPost = true
showPrevNextPost = true
reorderShares = ["WeChat", "x", "facebook", "whatsapp"]

# https://gohugo.io/templates/embedded/#configure-x-twitter-cards
[params.social]
twitter = "dgdghub"

[params.navItems]
home = { href = "/", icon = "home", title = "首页" }
github = { href = "https://github.com/88899", icon = "logo-github", title = "GitHub" }
# tools = { href = "https://www.518855.xyz", icon = "rocket", title = "导航" }
# docs = { href = "https://cici.pp.ua", icon = "documents", title = "文档" }
# me = { href = "https://985188.xyz", icon = "person", title = "About" }

[params.advanced]
customCSS = ["css/custom.css"]
# customJS = []

[params.experimental]
jsDate = true
jsDateFormat = "yyyy年MM月dd日"
# jsDateFormat = "yyyy年MM月dd日，cccc"

# for peht theme
#[params.Author]
#name = "nan"
#avatar = "img/personal/崩坏3-格蕾修.png"

[services]
[services.googleAnalytics]
ID = ""

[services.disqus]
# shortname = ""

# 多个内容目录映射
[module]
[[module.mounts]]
    source = "content"       # 实际目录：原 content 目录
    target = "content"       # 映射到虚拟 content 目录（保持原路径）

[[module.mounts]]
    source = "global"        # 实际目录：根目录下的 global 目录
    target = "content" # 映射到虚拟 content
